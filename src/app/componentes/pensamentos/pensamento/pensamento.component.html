<div class="pensamento {{ pensamento.modelo }} ff-roboto-mono" [ngClass]="larguraPensamento()"> <!--interpolação-->
    <img src="assets/imagens/{{ pensamento.modelo }}.png" alt="Aspas coloridas">

    <p class="conteudo">{{ pensamento.conteudo }}</p>
    <p class="autoria"><b>{{ pensamento.autoria }}</b></p>

    <div class="acoes">
        <button class="botao-editar">
            <img src="assets/imagens/icone-editar.png" (click)="irParaEditar(pensamento.id!)" alt="Ícone de editar">
        </button>
        <button class="botao-excluir" (click)="irParaExcluir(pensamento.id!)">
            <img src="assets/imagens/icone-excluir.png" alt="Ícone de excluir">
        </button>
    </div>
</div>
